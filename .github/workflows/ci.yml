name: Validate plugin
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Syntax and regression tests
        run: |
          node --check YetAnotherTranslator.plugin.js
          node --test YetAnotherTranslator.test.cjs
      - name: Check bundled locale catalogs
        run: |
          node scripts/bundle_locales.cjs
          git diff --exit-code -- YetAnotherTranslator.plugin.js
      - name: Verify Markdown rendering with React DOM
        run: |
          npm install --prefix .local/markdown-verify --ignore-scripts --no-audit --no-fund react@18.3.1 react-dom@18.3.1 jsdom@26.1.0 simple-markdown@0.7.3
          node scripts/verify_markdown.cjs
      - name: Build and verify release ZIP
        shell: pwsh
        run: ./scripts/package_release.ps1
